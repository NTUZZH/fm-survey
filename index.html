<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Work-order priorities</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; padding: 0; background: #ffffff; color: #111111;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                      "Helvetica Neue", Arial, sans-serif;
         font-size: 19px; line-height: 1.5; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 40px 16px; }
  p { margin: 0 0 16px; }
  a.btn { display: block; width: 100%; box-sizing: border-box; min-height: 56px;
          padding: 14px; margin: 24px 0 0; text-align: center; font-weight: bold;
          font-size: 20px; color: #ffffff; background: #111111; border: 2px solid #111111;
          border-radius: 10px; text-decoration: none; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <p id="msg">Opening the questions...</p>
  <p id="fallback" class="hide">If nothing happens, tap the button below.</p>
  <a class="btn hide" id="go" href="y3_w8_block1.html">Open the questions</a>
  <noscript>
    <p>This page needs JavaScript. Please open the link in Chrome, Safari or Edge.</p>
  </noscript>
</div>
<script>
/* One link for everybody.

   The three question sets hold different work orders, and a participant answers
   one of them. This page asks the study's database which set is furthest behind,
   takes a participant code with it, and sends the participant there, so the same
   link can go to every participant and the sets fill evenly without anyone
   deciding anything.

   The assignment is kept in localStorage, so a participant who closes the page
   and taps the same link again returns to the set they started, and the question
   page then restores their answers.

   If the database cannot be reached, the page assigns a set at random and issues
   its own code. The participant never sees a difference; the question page will
   fall back to returning the answers as a short code.

   The sender may override both: "?b=2" asks for a set, which is how a set that
   has attracted fewer answers is topped up, and "?r=R07" pins a code. */
(function () {
  "use strict";
  var KEY = "y3w8.entry.v1";
  var NSETS = 3;
  var ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  var API = "https://rgvzmearvdgdiqlbfoeh.supabase.co/rest/v1/rpc/w8_assign";
  var API_KEY = "sb_publishable_kVSqVmKpWdpTmQD0ZcmENw_Ef05MTDb";

  function param(name) {
    var m = String(window.location.search || "").match(
      new RegExp("[?&]" + name + "=([^&#]*)"));
    if (!m) { return ""; }
    try { return decodeURIComponent(m[1].replace(/\+/g, " ")); } catch (e) { return m[1]; }
  }

  function randomInts(n) {
    var out = [], i;
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(n);
      window.crypto.getRandomValues(buf);
      for (i = 0; i < n; i++) { out.push(buf[i]); }
      return out;
    }
    for (i = 0; i < n; i++) { out.push(Math.floor(Math.random() * 4294967296)); }
    return out;
  }

  function newCode() {
    var r = randomInts(5), s = "P", i;
    for (i = 0; i < 5; i++) { s += ALPHABET.charAt(r[i] % ALPHABET.length); }
    return s;
  }

  function cleanCode(v) {
    return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
  }

  function load() {
    try {
      var o = JSON.parse(window.localStorage.getItem(KEY));
      if (o && o.code && o.set >= 1 && o.set <= NSETS) { return o; }
    } catch (e) {}
    return null;
  }

  function save(o) {
    try { window.localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }

  function leave(state) {
    save(state);
    var url = "y3_w8_block" + state.set + ".html?r=" + encodeURIComponent(state.code);
    var go = document.getElementById("go");
    go.href = url;
    window.setTimeout(function () {
      document.getElementById("msg").textContent = "Work-order priorities";
      document.getElementById("fallback").className = "";
      go.className = "btn";
    }, 1500);
    window.location.replace(url);
  }

  var forcedSet = parseInt(param("b"), 10);
  var forcedCode = cleanCode(param("r"));
  var stored = load();
  var wantSet = (forcedSet >= 1 && forcedSet <= NSETS) ? forcedSet : 0;

  // Already assigned, and nothing overrides it: go straight back.
  if (stored && !wantSet && !(forcedCode && forcedCode !== stored.code)) {
    leave(stored);
    return;
  }

  var settled = false;
  var offline = function () {
    if (settled) { return; }
    settled = true;
    leave({ set: wantSet || ((randomInts(1)[0] % NSETS) + 1),
            code: forcedCode || (stored && stored.code) || newCode() });
  };

  if (!window.XMLHttpRequest) { offline(); return; }
  var xhr = new XMLHttpRequest();
  try {
    xhr.open("POST", API, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("apikey", API_KEY);
    xhr.setRequestHeader("Authorization", "Bearer " + API_KEY);
    xhr.timeout = 12000;
    xhr.onerror = offline;
    xhr.ontimeout = offline;
    xhr.onload = function () {
      if (settled) { return; }
      var r = null;
      try { r = JSON.parse(xhr.responseText); } catch (e) { r = null; }
      if (xhr.status === 200 && r && r.ok === true &&
          r.block >= 1 && r.block <= NSETS && r.code) {
        settled = true;
        leave({ set: r.block, code: cleanCode(r.code) });
      } else {
        offline();
      }
    };
    xhr.send(JSON.stringify({
      p_block: wantSet || null,
      p_code: forcedCode || (stored && stored.code) || null
    }));
  } catch (e) { offline(); }
}());
</script>
</body>
</html>
